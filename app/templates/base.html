<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DixTune{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <style>
        .logs-section { margin-top: 2rem; }
        .logs-section h2 { margin-bottom: 1rem; }
        .stats-bar { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .stat-item { padding: 0.5rem 1rem; border-radius: 4px; font-weight: bold; }
        .stat-item.success { background-color: #e8f5e9; color: green; }
        .stat-item.error { background-color: #ffebee; color: red; }
        .logs-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .log-entry { padding: 0.5rem; border-left: 3px solid #ccc; }
        .log-entry.success { border-left-color: green; }
        .log-entry.error { border-left-color: red; color: red; }
        .log-entry .timestamp { color: gray; font-size: 0.85rem; margin-right: 0.5rem; }
        .log-entry .log-status { font-weight: bold; margin-right: 0.5rem; }
        .log-entry .log-message { white-space: pre-wrap; }
    </style>
</head>
<body>
    <header>
        <h1>DixTune</h1>
        <nav>
            <a href="{{ url_for('read_channels_ui') }}">Каналы</a>
            <a href="{{ url_for('create_channel_form') }}">Добавить канал</a>
            <a href="{{ url_for('cookies_form') }}">Cookies</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
